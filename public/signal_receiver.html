<!DOCTYPE html>
<html>
<head>

	<link rel="stylesheet" href="css/common.css">

	<link rel="stylesheet" href="css/fonts.css">

	<script src="js/customalerter.js"></script>
	<script src="js/SuperScript.js"></script>

	<script src="js/animate.js"></script>

	<style>
		.lowerthird {
			position: fixed;
			bottom: 0;
			left: 0;
			padding: 32px;
			background: linear-gradient(80deg, #000274, #000000aa);
			/*width: min(1200px,98vw);*/
			width: 100vw;
			--sze: 7rem;
			opacity: 0;
			text-shadow: 0 0 7px rgba(0, 0, 0, 0.7);
		}
		.lowerthird .txt{
			display: block;
		}
		.lowerthird .txt.topic{
			font-family: 'AllerDis' !important;
			text-transform: uppercase;
			font-weight: 800;
			font-size: var(--sze);
		}
		.lowerthird .txt.speaker{
			font-family: 'Raleway' !important;
			text-transform: capitalize;
			letter-spacing: 1px;
			font-weight: 800;
			font-size: calc(var(--sze) * 0.68);
		}
		.lowerthird .midborder{
			height: 4px;
			width: 30%;
			background: var(--textcolor);
			display: block;
		}
	</style>
</head>
<body class="">
	<div class="centroid versival body_standin" id="mainpanel">
		<div class="content versedisplay">
			<!-- <h1>Receiver Output:</h1> -->
			<span class="verse-text" id="gottenverse">...</span>
			<span class="verse-location" id="output">Waiting for verse...</span>
		</div>
	</div>

	<div class="lowerthird">
		<span class="txt topic" id="thetopic">THE BIGGER PICTURE</span>
		<span class="midborder w3-hide"></span>
		<span class="txt speaker" id="thespeaker">By Pastor Nneka Ene</span>
	</div>

	<script src="js/app.js"></script>

	<script>
		// ui items
		let bodyel = undefined;
		let passage = undefined;
		let verse = undefined;
		let versedisplay = undefined;

		let ui_thrd = undefined;
		let ui_topictxt = undefined;
		let ui_theline = undefined;
		let ui_speakertxt = undefined;

		function initUIs() {
			verse = document.querySelector('#output');
			versedisplay = document.querySelector('.versedisplay');
			bodyel = document.querySelector('.versival');
			passage = document.querySelector('#gottenverse');

			ui_thrd = document.querySelector('.lowerthird');
			ui_topictxt = ui_thrd.querySelector('.txt.topic');
			ui_theline = ui_thrd.querySelector('.midborder');
			ui_speakertxt = ui_thrd.querySelector('.txt.speaker');
		}

		// functions specific to signal_receiver --------------------------------

		function hideverseguy(){
			passage.animate(fadeout,timing);
		}	

		function showverseguy(){
			autoResizeText(passage,versedisplay,16,102,() => {alert_warning("text overflow")})
			passage.animate(slidein,timing);
		}

		function reset_styles(s) {
			console.log(curstyles_viewer);
			let cn = s != "silent";

			if(cn){
				alert_warning("reloading styles");
			}

			let txt_0_styles = curstyles_viewer.myelements[0].styles;
			let txt_1_styles = curstyles_viewer.myelements[1].styles;
			let bg_styles = curstyles_viewer.myelements[2].styles;
			let slide_styles = curstyles_viewer.myelements[3].styles;

			let p_txt_0_styles = returnstyles(txt_0_styles).join(";");
			let p_txt_1_styles = returnstyles(txt_1_styles).join(";");
			let p_bg_styles = genbgstyles(bg_styles);
			let p_slide_styles = returnstyles(slide_styles).join(";");

			verse.setAttribute("style",p_txt_1_styles);
			versedisplay.setAttribute("style",p_txt_0_styles);
			bodyel.setAttribute("style",p_bg_styles);

			console.log([txt_0_styles,txt_1_styles,bg_styles,slide_styles]);
			console.log(returnstyles(txt_0_styles).join(";"));
		}

		function returnstyles(m) {
			let ou = [];
			Object.keys(m).forEach(el => {
				let line = `${el}:${m[el]}`;
				ou.push(line);
			})

			return ou;
		}

		function genbgstyles(bgs) {
			// window['degme'] = bgs;
			let thestyle = bgs.style;
			let sdata = bgs[thestyle];
			let outstyle = "background: black";

			if(thestyle == "gradient"){
				if(sdata.type == "linear"){
					outstyle = `background: linear-gradient(${sdata.angle}deg,${sdata.colors.join(",")})`
				}
			}
			console.log(bgs);

			return outstyle;
		}

		function showhostinfo() {
			// hide all elements first
			ui_thrd.animate(hideme,{...timing,duration: 2});
			ui_topictxt.animate(hideme,{...timing,duration: 2})
			ui_theline.animate(hideme,{...timing,duration: 2})
			ui_speakertxt.animate(hideme,{...timing,duration: 2})

			let thedelay = 20;
			let mytimes = {...timing,duration: 2200,delay: thedelay}

			ui_thrd.animate(frames_slatein,mytimes);

			mytimes.duration = 700;
			mytimes.delay += 400;
			ui_topictxt.animate(slidein,mytimes);
			mytimes.delay += 70;
			ui_theline.animate(slidein,mytimes);
			mytimes.delay += 70;
			ui_speakertxt.animate(frames_spacen,mytimes);
		}

		function hidehostinfo() {
			// hide all elements first
			let thedelay = 20;
			let mytimes = {...timing,duration: 2200,delay: thedelay}


			mytimes.duration = 700;
			mytimes.delay += 400;
			ui_topictxt.animate([...entrance].reverse(),mytimes);
			mytimes.delay += 70;
			ui_theline.animate([...entrance].reverse(),mytimes);
			mytimes.delay += 70;
			ui_speakertxt.animate([...frames_spacen].reverse(),mytimes);
			ui_thrd.animate([...frames_slatein].reverse(),mytimes);
		}

		// event listeners
		window.addEventListener('load',() => {
			initUIs();
			sceneops['regetstyles']("silent");

			return;
			showhostinfo();
			setTimeout(() => {
				hidehostinfo()
			},7000);
		})

		// end ------------------------------------------------------------------
	

		// in beta, hasnt been tested yet
		let words = [];

		function autoResizeText({
			textElement,
			containerElement,
			minFontSize = 12,
			segmentCharLength = 30,
			onResizeLimitReached = () => {},
		}) {
			console.log(textElement)
			return;
			let fontSize = parseFloat(window.getComputedStyle(textElement).fontSize);
			const originalText = textElement.textContent;

			function fits() {
				return textElement.scrollWidth <= containerElement.clientWidth &&
							 textElement.scrollHeight <= containerElement.clientHeight;
			}

			// Step 1: Reduce font size until it fits or hits minimum
			while (!fits() && fontSize > minFontSize) {
				fontSize -= 1;
				textElement.style.fontSize = fontSize + 'px';
			}

			// Step 2: If it still doesn't fit, start trimming
			if (!fits()) {
				onResizeLimitReached();

				let currentText = originalText;
				textElement.textContent = currentText;

				// Binary search the max number of characters that fit
				let low = 0;
				let high = currentText.length;
				let fitLength = 0;

				while (low <= high) {
					const mid = Math.floor((low + high) / 2);
					textElement.textContent = currentText.slice(0, mid);
					if (fits()) {
						fitLength = mid;
						low = mid + 1;
					} else {
						high = mid - 1;
					}
				}

				// Final fit text
				const finalFitText = currentText.slice(0, fitLength);
				textElement.textContent = finalFitText;

				// Step 3: Split into segments of defined length
				words = [];
				for (let i = 0; i < finalFitText.length; i += segmentCharLength) {
					words.push(finalFitText.slice(i, i + segmentCharLength));
				}
			}
		}
	</script>
</body>
</html>
