	<style>
		/* .mybtn{background-color: var(--clr-panelbg);} */
		.verse_type_area{
			width: 100%;
			max-width: 700px;
			display: flex;
			gap:0;
			border: 1px solid var(--clr-border);
			border-radius: var(--roundness);
			overflow: hidden;
		}
		.verse_type_area input{
			flex: 1;
			padding: 12px 16px;
			border: 1px solid transparent;
		}
		.verse_type_area input:focus{
			outline: none;
		}
		.verse_type_area button{
			border: none;
			flex: 0 1 120px;
		}
		.verse_type_area:has(input:focus){
			border: 1px solid var(--themecolor);
		}
		.verse_type_area:has(input:focus) button{
			background-color: var(--themecolor);
			color: #fff;
		}

		.booksHelper .taglist{
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
		}
		.booksHelper .taglist .item{
			padding: 12px 16px;
			font-size: 1.2rem;
			border: 1px solid var(--clr-border);
			border-radius: var(--roundness);
			cursor: pointer;
			/*flex: 1 0 auto;*/
		}
		.booksHelper .taglist .item:hover{
			border: 1px solid var(--themecolor);
			color: var(--themecolor);
		}

		.cur_heading{
			display: flex;
			align-items: center;
			justify-content: center;
			text-transform: uppercase;
			letter-spacing: 2px;
			padding: 12px;
			color: var(--clr-text-muted);
			font-weight: 800;
		}
		.curverse{
			font-weight: 700;
			text-transform: capitalize;
		}

		.tabsguy>.tab{
			max-width: 1280px;
			margin: 0 auto;
		}
		.tab{
			display: flex;
			flex-direction: row;
			flex-wrap: wrap;
			gap: 0;
		}
		.tab .inner_guy{
			flex: 1 1 700px;
			max-height: 98vh;
			padding: 16px 0;
			overflow-y: auto;
			overflow-x: hidden;
		}
		.tab .divider{
			flex: 0 0 1px;
			background-color: var(--clr-border);
		}
		.tab .sidemenu{
			flex: 1;
		}
		.upbtn{display: none !important;}

		@media (max-width:992px){
			.sidemenu{
				position: fixed;
				top: 0;
				right: 0;
				height: 100%;
				width: 100%;
				max-width: 350px;
				background: rgba(230, 230, 230, 0.744);
				backdrop-filter: blur(5px);
				translate: 100px 0;
				pointer-events: none;
				opacity: 0;
			}
			.sidemenu.show{
				opacity: 1;
				translate: 0 0;
				pointer-events: all;
				backdrop-filter: blur(5px) saturate(160%);
			}
			[data-mode="dark"] .sidemenu{
				background: rgba(0, 0, 0, 0.748);
			}
		}

		body:has(.sidemenu.show) .myicon{
			rotate: 180deg;
		}

	<script>
		// UIs
		let bkslist = undefined;
		let tipguy = undefined;
		let nptguy = undefined;
		let curverse = undefined;
		let controls = undefined;
		let autoshow = undefined;

		let shared_dis = undefined;
		let books_UI = undefined;
		let options_UI = undefined;

		// runtime data
		let thebks = [];
		let curversedata = {
			book: undefined,
			chapter: undefined,
			verse: undefined,
		};
		let speaker_deets = {};

		let panelsshown = false;
		let hostshown = false;

		// UI ops
			function initUIs() {
				bkslist = document.querySelector('#bookslist');
				tipguy = document.querySelector('.tiptxt');
				nptguy = document.querySelector('#verseInput');
				curverse = document.querySelector('.curverse>h1');
				controls = document.querySelectorAll('.btn_controls>button');
				autoshow = document.querySelector('#autoshow');

				shared_dis = document.querySelector('[data-role="shared_display"]');
				books_UI = document.querySelector('[data-subrole="book"]');
				options_UI = document.querySelector('[data-subrole="project_options"]');

				// make UI events
				nptguy.addEventListener('input',(n) => {
					// console.log('input arg',n);
					if(curversedata.book == undefined){
						filterbooks_ui(n.target.value);
					}
					gettips();
				})

				nptguy.addEventListener('keydown',(e) => {
					if(e !== undefined){
						if(e.key.toLowerCase() == "enter"){
							sendmsg();
						}
					}
				})

				/*
					// disable controls for now
					controls[0].addEventListener('click', () => {
						getnext_passage(-1);
					})

					controls[1].addEventListener('click', () => {
						getnext_passage(1);
					})
				// */

				// render the books
				render_these(null,'books');
			}
			function loadbibleverses() {
				bkslist.innerHTML = "";

				thebks = getallbooks();

				thebks.forEach(el => {
					let opt = `<option value="${el.name}"></option>`;
					bkslist.innerHTML += opt;
				})
			}
			function gettips() {
				let tip = "start typing to get tips";
				let txt = nptguy.value.toLowerCase().trim();
				let conti = true;

				if(txt != ""){
					if(!txt.includes(":")){
						// no chapter yet validate the book
						// remove any numbers but dont remove the prefix ones
						txt = txt.replace(/(?<=\b)(?!^\d)\d+/g, '').trim();
						// console.log("post processed: " + txt)

						// see if the book is in the list provided no chapter was entered yet

						let thebook = findbook(txt);
						if(thebook != undefined){
							curversedata.book = thebook.name;
							let tmp_chaps = thebook.chapters;
							let cap = plural("chapter",Number(tmp_chaps));
							tip = `${txt} has ${tmp_chaps} ${cap}`;
						} else {
							tip = `<b>${txt}</b> is not a valid book`;
						}
					} else {
						// has a chapter or verse combo
						let hay = txt.split(" ");
						let versepart = hay.pop().split(":");
						let needle = versepart[0];
						let book = hay.join(" ");
						let n = undefined;

						let thebook = findbook(book);
						curversedata.book = thebook.name;
						curversedata.chapter = needle;

						if(versepart.length > 1){
							curversedata.verse = Number(versepart[1].split('-')[0].trim());
						}

						if(thebook != undefined){
							n = thebook.verses[needle - 1];
							if(n != undefined){
								let cap = plural("verse",Number(n));
								tip = `${book} ${needle} has ${n} ${cap}`;
							} else {
								tip = "that chapter doesnt exist";
							}
						} else {
							tip = `<b>${txt}</b> is not a valid book`;
						}

					}
				}

				tipguy.innerHTML = `<i>${tip}</i>`;
				// updateRelevantos();
			}
			function updateUI(n) {
				// switches between tab 1 and 0
				let tabs = document.querySelectorAll('.senderbox.section');
				let active = tabs[n];
				let passive = tabs[(n + 1) % tabs.length];

				active.animate(slideout,{...timing});

				setTimeout(() => {
					// hide active
					active.style.display = "none";
					// animatein passive
					passive.animate(hideme,{...timing,duration: 100});
					passive.style.display = "flex";
					passive.style.display = "flex";
					passive.animate(slidein,{...timing,delay: 100});
				},timing.duration)
			}
			function showreport(){
				let cd = curversedata;
				let passage = `${cd.book} ${cd.chapter}:${cd.verse}`;
			}
			function getnext_passage(offset) {
				let cd = {...curversedata};
				let verse = Number(cd.verse);
				cd.verse = verse + offset;

				if(cd.verse < 1){
					cd.verse = 1;
				}

				let passage = `${cd.book} ${cd.chapter}:${cd.verse}`;
				if(analysemsg(passage)){
					let curversedata = {...cd};
					updateRelevantos();
					sendmsg();
				}
			}

		// runtime stuff
			function analysemsg(msg) {
				let [book, chapter, verse, fincon] = [0,0,0,false];
				let tip = "";
				let cap = "";


				if(!msg.includes(":")){
					tip = "incomplete verse";
				} else {
					let hay = msg.split(":");
					let tmp_fore = hay[0].split(" ");
					let tmp_latter = hay[1].split("-");

					chapter = tmp_fore.pop();
					book = tmp_fore.join(" ").toLowerCase();
					verse = tmp_latter[0];

					console.log("latter -> ", tmp_latter[0])
					console.log("analysing...",book, chapter, verse)

					// find the book in the list, again
					let tmp_found = 0,found_id = undefined;

					thebks.forEach((el,id) => {
						let tmp_con = el.name.toLowerCase() == book;
						if(tmp_con){
							tmp_found += 1;
							found_id = id;
						} else {
							// console.log(`${el.name.toLowerCase()} == ${txt} -> ${tmp_con}`);
						}
					})

					if(tmp_found > 0){
						// check if chapters are ok
						let chaps = Number(thebks[found_id].chapters);
						cap = plural("chapter",Number(chaps));
						fincon = chapter <= chaps;
						console.log(`analysing: ${fincon} = ${chapter} <= ${chaps};`)

						if(fincon){
							// check if verses are okay
							let n = Number(thebks[found_id].verses[chapter - 1]);
							cap = plural("verse",(n));
							fincon = Number(verse) < (n + 1);

							console.log(`analysing verse: ${verse} <= ${n} -> ${fincon}`);
							tip = fincon ? "" : `${book} ${chapter} has only ${n} ${cap}`;
						} else {
							tip = `${book} has only ${chaps} ${cap}`;
						}
					} else {
						tip = `<b>${book}</b> is not a valid book`;
					}
				}

				if(!fincon){
					alert_danger(tip,3);
				} else {
					curversedata = {book, chapter, verse};
				}

				return fincon;
			}

			function sendThis(type,action) {
				setTimeout(() => {
					try{
						let payload = `${type}->${action}`;
						sendMessage(payload);
					} catch(err){
						alert_danger(err.message);
						console.error(err);
					}
				},100);
			}

			function sendmsg() {
				setTimeout(() => {
					try{
						let themsg = mekverse();

						if(themsg != ""){
							if(analysemsg(themsg)){
								sendMessage(themsg);
								// updateUI(50);
								showreport();

								/*
								let show = autoshow.checked == true;
								if(show){
									showpanel();
								}
								// */

								alert_success('passage sent')
							}
						} else {
							alert_warning("enter a verse first",2);
						}
					} catch(err){
						console.error(err);
						alert_danger(err.message);
					}
				}, 50);
			}

			function hidepanel(){
				panelsshown = false;
				sendThis('action','hide');
				// toggleShowB('#showbtn','inline-flex','none');
				// toggleShowB('#hidebtn','inline-flex','none');
			}
			function showpanel() {
				panelsshown = true;
				sendThis('action','appear');
				// toggleShowB('#hidebtn','inline-flex','none');
				// toggleShowB('#showbtn','inline-flex','none')
			}

			function togglehostpanel() {
				let c = hostshown ? 'hidethird' : 'showthird';
				let v = hostshown ? 'hidden' : 'visible';
				title_toggler.querySelector('span.state').innerHTML = `[${v}]`;
				alert_dark(`lowerthird ${v}`);
				sendThis('action',c);

				hostshown = !hostshown;
			}

		// event listeners
		const startguy = () => {
			alert_info('starting UI');
			initUIs();
			loadbibleverses();
		};

		// keyboard shortcuts
		window.addEventListener('keydown',e => {
			if(e.altKey){
				// disables default behavour unless shift is included in the command
				if(!e.shiftKey){
					e.preventDefault();
				}

				if(e.key.toLowerCase() == "s"){
					if(panelsshown)
						hidepanel();
					else
						showpanel();
				}
				if(e.key.toLowerCase() == "arrowup"){
					sendThis('action','sizeup');
				}
				if(e.key.toLowerCase() == "arrowdown"){
					sendThis('action','sizedown');
				}
				if(e.key.toLowerCase() == "arrowleft"){
					getnext_passage(-1);
				}
				if(e.key.toLowerCase() == "arrowright"){
					getnext_passage(1);
				}
				if(e.key.toLowerCase() == "r"){
					sendmsg();
				}
				if(e.key.toLowerCase() == "d"){
					// updateUI(1);
				}
				if(e.key.toLowerCase() == "a"){
					togglehostpanel();
				}
			}

			// console.log(e);
		})

		callOnLoad.push({act: setup_uimode});
		callOnLoad.push({act: startguy});
	</script>

	<script>
		// workers
			function updateRelevantos() {
				let cvd = curversedata;
				let theverse = mekverse();

				nptguy.value = theverse;
				curverse.innerHTML = theverse;

				controls.forEach(c => {
					c.style.opacity = "1";
					c.style.pointerEvents = "all";
				})

				if(theverse.toLowerCase() == "revelation 22:21"){
					controls[1].style.opacity = "0.1";
					controls[1].style.pointerEvents = "none";
					// alert_warning("found end");
				} else if(theverse.toLowerCase() == "genesis 1:1"){
					controls[0].style.opacity = "0.1";
					controls[0].style.pointerEvents = "none";
					// alert_warning("found start");
				}
			}
			function toggle_projector_options(con = false) {
				if(con instanceof HTMLElement){
					con = con.dataset.con.toLowerCase() == "true";
				}

				let cls = con ? "add" : "remove";
				let cls2 = !con ? "add" : "remove";

				alert_info('toggling projector options');
				books_UI.classList[cls]('w3-hide');
				options_UI.classList[cls2]('w3-hide');

				if(con === true){
					setTimeout(() => {
						sendmsg();
					}, 20);
				} else {
					curversedata = {
						book: undefined,
						chapter: undefined,
						verse: undefined,
					};
				}

				updateRelevantos();
			}
			function findbook(txt){
				let tmp_found = 0
				let found_id = undefined
				let found = undefined;

				thebks.forEach((el,id) => {
					let tmp_con = el.name.toLowerCase() == txt.toLowerCase();
					if(tmp_con){
						tmp_found += 1;
						found = el;
					} else {
						// console.log(`${el.name.toLowerCase()} == ${txt} -> ${tmp_con}`);
					}
				});

				return found;
			}
			function mekverse() {
				let cvd = curversedata;
				let theverse = `${cvd.book || ''} ${cvd.chapter || ''}${cvd.verse == undefined ? '' : ':'}${cvd.verse || ''}`;

				if(cvd.book == undefined){
					theverse = '';
				}
				return theverse;
			}
			function toggleversepanel(m) {
				let c = panelsshown ? 'hide' : 'appear';
				let v = panelsshown ? 'hidden' : 'visible';
				panel_toggler.querySelector('span.state').innerHTML = `[${v}]`;

				sendThis('action',c);
				panelsshown = !panelsshown;
			}

			function filterbooks_ui(wot) {
				let its = books_UI.querySelectorAll('.item');

				if(curversedata.books != undefined){
					return;
				}

				its.forEach(t => {
					if(!(t.innerHTML.toLowerCase().includes(wot))){
						t.classList.add('w3-hide');
					} else {
						t.classList.remove('w3-hide');
					}
				});
			}
		// renderers
			function render_these(n,wot,prev = ''){
				let cap = wot;
				shared_dis.innerHTML = '';

				if(wot.toLowerCase() != 'books'){
					for(let x = 1;x <= n;x++){
						shared_dis.innerHTML += `
							<div class="item slide-up" data-runme="set_${wot}" data-${wot}="${x}" style="${mekstagger(2,x)}">${x}</div>
						`;
					}

					if(wot == 'chapter'){
						cap = `${wot}s in ${curversedata.book}`;
					}else if(wot == 'verse'){
						cap = `${wot}s in ${curversedata.book} ${curversedata.chapter}`;
					}
				} else {
					let books = [...bibleBooks.OldTestament,...bibleBooks.NewTestament];

					books.forEach((b,x) => {
						let bd = b.split('|');
						let bk = bd[0], bc = bd[1];

						shared_dis.innerHTML += `
							<div class="item slide-up" data-runme="set_book" data-mybook="${bk}" data-chapters="${bc}" style="${mekstagger(2,x)}">${bk}</div>
						`;
					})
				}

				let anc = books_UI.querySelector(`[data-subrole="announce"]`);

				if(anc != undefined){
					anc.innerHTML = cap;
				}
			}

		// runme ops
			function set_book(el){
				curversedata.chapter = undefined;
				curversedata.verse = undefined;

				let bk = el.dataset.mybook || '';
				let chap = el.dataset.chapters || 0;
				nptguy.value = `${bk} `;
				curversedata.book = bk;
				gettips();

				render_these(chap,'chapter');
				updateRelevantos();
				refreshUI(200);
			}
			function set_chapter(el){
				let bk = el.dataset.chapter || '';
				curversedata.chapter = bk;
				nptguy.value = `${curversedata.book} ${curversedata.chapter}:`;
				gettips();

				let bookdata = findbook(curversedata.book);
				let verses = bookdata.verses;
				let myverses = verses[Number(bk) - 1];
				console.log('bookdata',bookdata);
				console.log('verses',verses);
				console.log('myverses',myverses);

				render_these(myverses,'verse');
				updateRelevantos();
				refreshUI(200);
			}
			function set_verse(el) {
				let bk = el.dataset.verse || '';
				curversedata.verse = bk;
				nptguy.value = `${curversedata.book} ${curversedata.chapter}:${curversedata.verse}`;

				toggle_projector_options(true);
				render_these('myverses','books');
				updateRelevantos();
				refreshUI(200);
			}
			function getnext_verse(el,bps = false){
				if(!(el instanceof HTMLElement) && !bps){
					alert_danger('invalid procedure call');
					return;
				}

				getnext_passage(Number(el.dataset.offset));
			}
			function adjust_size(el) {
				let con = el === true;

				if(el instanceof HTMLElement){
					con = el.dataset.offset == "1" || el.dataset.offset.toLowerCase() == "yes";
				}

				let wot = con ? 'sizeup' : 'sizedown';
				sendThis('action',wot);
			}
			function changehostdetails() {
				let inputs = [
					{
						typ: 'text',
						field: 's_name',
						label: 'speaker name',
						placeholder: 'who is preaching today?',
						required: true,
						value: speaker_deets.s_name || '',
					},
					{
						typ: 'select',
						field: 's_title',
						label: 'speaker title',
						options: [
							{"value" : 'minister'},
							{"value" : 'Pastor'},
							{"value" : 'Deacon'},
							{"value" : 'Guest'},
							{"value" : '', "caption" : "(leave blank)"},
						],
						value: speaker_deets.s_title || '',
					},
					{
						typ: 'text',
						field: 's_topic',
						label: 'the topic',
						placeholder: 'what is the topic?',
						required: true,
						value: speaker_deets.s_topic || '',
					},
				];

				get_input("Enter speaker details",inputs,send_speaker_details);
			}
			window['send_speaker_details'] = (d) => {
				console.log('speaker',speaker_deets,speaker_deets.s_name);

				if(d instanceof HTMLElement){
					if(speaker_deets.s_name == undefined){
						alert_danger('speaker details unavailable')
						return;
					} else {
						d = speaker_deets;
					}
				} else {
					speaker_deets = d;
				}

				console.log('recieved',d);
				let ts = JSON.stringify(d);
				let final_pl = `set_speaker|||${ts}`;
				console.log('payload',final_pl);
				sendThis('data',final_pl);
			};
			window['try_send_msg'] = (el) => {
				// alert_info('submitting');
				gettips();

				if(analysemsg(mekverse())){
					alert_info('we good cheese');
					toggle_projector_options(true);
					updateRelevantos();
					sendmsg();
				}
			}
			window['togglemenu'] = (el) => {
				document.querySelector('#mysidemenu').classList.toggle('show');
			}
	</script>
</body>
