<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SRT Lyrics Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    #lines {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 20px;
    }
    .line {
      padding: 5px;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }
    .line.active {
      background-color: yellow;
    }
  </style>
</head>
<body>

  <h2>SRT Lyrics Viewer</h2>
  <input type="file" id="srtFileInput" accept=".srt">
  <button id="playBtn" disabled>Play</button>
  <div class="timeguy">--:--</div>

  <div id="lines"></div>

  <script>
    const fileInput = document.getElementById('srtFileInput');
    const playBtn = document.getElementById('playBtn');
    const linesContainer = document.getElementById('lines');
    const timeshow = document.querySelector('.timeguy')

    let lines = [];
    let currentLineIndex = -1;
    let playStartTime = null;
    let playTimer = null;

    fileInput.addEventListener('change', handleFileUpload);
    playBtn.addEventListener('click', simulatePlay);

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file || !file.name.endsWith('.srt')) {
        alert('Please upload a .srt file');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const srtText = e.target.result;
        lines = parseSRT(srtText);
        displayLines(lines);
        playBtn.disabled = false;
      };
      reader.readAsText(file);
    }

    function parseSRT(data) {
      // Normalize line endings and strip BOM
      data = data.replace(/\r\n|\r/g, '\n').replace(/^\uFEFF/, '');

      const regex = /\d+\s*\n(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})\s*\n([\s\S]*?)(?=\n{2,}|$)/g;
      const result = [];
      let match;
      while ((match = regex.exec(data)) !== null) {
        result.push({
          start: parseSrtTime(match[1]),
          end: parseSrtTime(match[2]),
          text: match[3].trim().replace(/\n/g, ' ')
        });
      }
      return result;
    }

    function parseSrtTime(timeString) {
      const [h, m, sMs] = timeString.split(':');
      const [s, ms] = sMs.split(',');
      return parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(s) + parseInt(ms) / 1000;
    }

    function displayLines(lines) {
      linesContainer.innerHTML = '';
      lines.forEach((line, index) => {
        const div = document.createElement('div');
        div.className = 'line';
        div.id = 'line-' + index;
        div.innerHTML = `<strong>${formatTime(line.start)}</strong> - ${line.text}`;
        linesContainer.appendChild(div);
      });
    }

    function formatTime(seconds) {
      const date = new Date(seconds * 1000);
      return date.toISOString().substr(11, 8);
    }

    function simulatePlay() {
      if (playTimer) {
        clearInterval(playTimer);
      }

      playStartTime = Date.now() / 1000;
      currentLineIndex = -1;

      playTimer = setInterval(() => {
        const currentTime = Date.now() / 1000 - playStartTime;
        timeshow.innerHTML = formattym(currentTime);
        updateActiveLine(currentTime);
      }, 200);
    }

    function updateActiveLine(currentTime) {
      let newIndex = lines.findIndex((line) =>
        currentTime >= line.start && currentTime <= line.end
      );

      if (newIndex !== -1 && newIndex !== currentLineIndex) {
        highlightLine(newIndex);
        curline(newIndex);
        currentLineIndex = newIndex;
      }
    }

    function highlightLine(index) {
      document.querySelectorAll('.line').forEach(line => line.classList.remove('active'));
      const activeDiv = document.getElementById('line-' + index);
      if (activeDiv) {
        activeDiv.classList.add('active');
        activeDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Callback when the current line changes
    function curline(lineid) {
      console.log("Current line:", lineid);
      // Hook for your logic
    }

    function formattym(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
  </script>

</body>
</html>
